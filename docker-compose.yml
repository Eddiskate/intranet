services:
  intranet:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SEED_ON_START: "true"
      DATA_DIR: /data
      UPLOADS_DIR: /data/uploads
      # Podstaw swój connection string MongoDB:
      DATABASE_URL: mongodb://mongo:27017/intranet
    volumes:
      - intranet-data:/data
    depends_on:
      - mongo
    restart: unless-stopped

  # Opcjonalnie lokalnie — na EasyPanel używasz zewnętrznego Mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  intranet-data:
  mongo-data:
