<div class="shell">
  <header class="topbar">
    <a routerLink="/helpdesk" class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__text">
        <strong>Intranet</strong>
        <small>Szpital Rejonowy · Racibórz</small>
      </span>
    </a>

    <div class="topbar__right">
      <nav>
        <a routerLink="/helpdesk" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Zgłoszenia
        </a>
        @if (auth.isLoggedIn()) {
          <a routerLink="/helpdesk/dashboard" routerLinkActive="active">Dashboard</a>
          <a routerLink="/helpdesk/users" routerLinkActive="active">Użytkownicy</a>
        }
      </nav>

      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.mode() === 'dark' ? 'Włącz tryb jasny' : 'Włącz tryb ciemny'"
        [title]="theme.mode() === 'dark' ? 'Tryb jasny' : 'Tryb ciemny'"
      >
        {{ theme.mode() === 'dark' ? 'Tryb jasny' : 'Tryb ciemny' }}
      </button>

      @if (auth.isLoggedIn()) {
        <div class="auth-chip">
          <span class="auth-chip__name">{{ auth.displayName() }}</span>
          <button type="button" class="auth-chip__out" (click)="logout()">Wyloguj</button>
        </div>
      } @else {
        <a routerLink="/login" class="login-link">Zaloguj się</a>
      }
    </div>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
